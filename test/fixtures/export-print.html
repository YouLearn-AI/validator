<!doctype html>
<!--
  A stand-in for the web app's print route (ops I-1313), served by test/export.test.mjs: the same handshake as
  the real page (export-renderer.mjs), drawn with KaTeX for math and an inline SVG for a diagram. The real page
  draws chunks with the chat's own components; this one draws only what the tests check: every paragraph of a
  "response" chunk (blank lines split paragraphs; $...$ and $$...$$ are math), a "whiteboard" chunk as an SVG
  diagram, and an image. Text goes in with textContent, never as HTML.
-->
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="/assets/katex/katex.min.css">
  <script src="/assets/katex/katex.min.js"></script>
  <script src="/assets/katex/contrib/auto-render.min.js"></script>
  <style>
    body { font-family: sans-serif; font-size: 14px; line-height: 1.5; margin: 0; }
    h1 { font-size: 22px; }
    p { margin: 0 0 10px; }
    figure { margin: 12px 0; }
  </style>
</head>
<body>
  <main id="doc"></main>
  <script>
    const main = document.getElementById('doc');
    const SVG = 'http://www.w3.org/2000/svg';

    function diagram(labels) {
      const svg = document.createElementNS(SVG, 'svg');
      svg.setAttribute('viewBox', `0 0 ${labels.length * 180} 60`);
      svg.setAttribute('width', String(labels.length * 180));
      svg.setAttribute('height', '60');
      labels.forEach((label, i) => {
        const box = document.createElementNS(SVG, 'rect');
        Object.entries({ x: i * 180 + 4, y: 4, width: 150, height: 50, rx: 8, fill: '#eef', stroke: '#336' })
          .forEach(([k, v]) => box.setAttribute(k, String(v)));
        const text = document.createElementNS(SVG, 'text');
        Object.entries({ x: i * 180 + 79, y: 34, 'text-anchor': 'middle', 'font-size': 14 })
          .forEach(([k, v]) => text.setAttribute(k, String(v)));
        text.textContent = label;
        svg.append(box, text);
      });
      const figure = document.createElement('figure');
      figure.append(svg);
      return figure;
    }

    function image(src) {
      const img = new Image();
      const settled = new Promise((resolve) => {
        img.onload = () => resolve(img.naturalWidth > 0);
        img.onerror = () => resolve(false);
      });
      img.src = src;
      main.append(img);
      return settled;
    }

    window.__youlearnExportRender = async (doc) => {
      if (doc.title === 'fail') throw new Error('page refused: ' + doc.outputs[0].chunks[0].content);
      document.documentElement.lang = doc.language || 'en';
      const h1 = document.createElement('h1');
      h1.dir = 'auto';
      h1.textContent = doc.title;
      main.append(h1);
      let diagrams = 0;
      const images = [];
      for (const output of doc.outputs) {
        for (const chunk of output.chunks) {
          if (chunk.type === 'response') {
            for (const text of chunk.content.split(/\n\s*\n/)) {
              const p = document.createElement('p');
              p.dir = 'auto';
              p.textContent = text.trim();
              main.append(p);
            }
          } else if (chunk.type === 'whiteboard') {
            main.append(diagram(chunk.content.split('->').map((s) => s.trim())));
            diagrams += 1;
          } else if (chunk.type === 'image') {
            images.push(image(chunk.content));
          }
        }
      }
      renderMathInElement(main, {
        delimiters: [{ left: '$$', right: '$$', display: true }, { left: '$', right: '$', display: false }],
        throwOnError: false,
      });
      const loaded = await Promise.all(images);
      return { diagrams, imagesFailed: loaded.filter((ok) => !ok).length };
    };
  </script>
</body>
</html>
