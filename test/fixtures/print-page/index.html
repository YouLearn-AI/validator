<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Print page fixture</title>
<!--
  A fixture print page for print-page-contract.mjs, not the web app's (phase 2 builds that one). It does what the
  contract asks with a tiny Markdown subset: headings, paragraphs and pipe tables. Consecutive text and citation
  chunks are merged into one run first, as the web's groupMessages does, so text after a citation prints.
  ?mode= picks a misbehaviour for the tests: error, never, nocontract, navigate, throw, popup, slowcontract,
  hostleak (an image whose hostname carries text, which the egress guard refuses).
-->
<style>
  @page { size: Letter; margin: 0.75in; }
  body { font: 12pt/1.5 sans-serif; color: #111; margin: 0; }
  h1 { font-size: 20pt; } h2 { font-size: 16pt; } h3 { font-size: 13pt; }
  table { border-collapse: collapse; margin: 8pt 0; }
  td, th { border: 1px solid #999; padding: 3pt 6pt; text-align: start; }
  figure { border: 1px solid #ccc; padding: 6pt; margin: 8pt 0; }
</style>
</head>
<body>
<main id="doc"></main>
<script>
(() => {
  const mode = new URLSearchParams(location.search).get('mode') || '';
  const root = document.documentElement;
  const TEXT_TYPES = new Set(['response', 'source', 'space_source']);

  const signal = (state, code) => {
    root.dataset.printState = state;
    if (code) root.dataset.printError = code;
  };

  // Runs of text and citation chunks, merged; any other chunk on its own.
  function groups(chunks) {
    const out = [];
    for (const chunk of chunks) {
      const last = out[out.length - 1];
      if (TEXT_TYPES.has(chunk.type)) {
        if (last && last.kind === 'text') last.text += String(chunk.content ?? '');
        else out.push({ kind: 'text', text: String(chunk.content ?? '') });
      } else {
        out.push({ kind: 'chunk', chunk });
      }
    }
    return out;
  }

  function cells(line) {
    return line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map((c) => c.trim());
  }

  function block(text, parent) {
    const lines = text.split('\n');
    if (lines.length >= 2 && lines.every((l) => l.trim().startsWith('|'))) {
      const table = document.createElement('table');
      for (const [i, line] of lines.entries()) {
        if (i === 1 && /^[\s|:-]+$/.test(line)) continue;
        const row = table.insertRow();
        for (const value of cells(line)) {
          const cell = document.createElement(i === 0 ? 'th' : 'td');
          cell.dir = 'auto';
          cell.textContent = value;
          row.appendChild(cell);
        }
      }
      parent.appendChild(table);
      return;
    }
    const heading = /^(#{1,3})\s+(.*)$/.exec(text.trim());
    const el = document.createElement(heading ? `h${heading[1].length}` : 'p');
    el.dir = 'auto';
    el.textContent = heading ? heading[2] : text.trim();
    parent.appendChild(el);
  }

  async function render(input) {
    if (!input || input.version !== 1 || !Array.isArray(input.chunks)) {
      signal('error', 'bad_input');
      return;
    }
    if (mode === 'error') {
      signal('error', 'render_failed');
      return;
    }
    if (mode === 'navigate') {
      location.href = 'http://elsewhere.test/';
      return;
    }
    if (mode === 'popup') window.open('http://elsewhere.test/popup');
    if (input.language) root.lang = input.language;
    const doc = document.getElementById('doc');
    if (input.title) {
      const h = document.createElement('h1');
      h.dir = 'auto';
      h.textContent = input.title;
      doc.appendChild(h);
    }
    for (const group of groups(input.chunks)) {
      if (group.kind === 'text') {
        for (const part of group.text.split(/\n\s*\n/)) if (part.trim()) block(part, doc);
      } else if (group.chunk.type === 'whiteboard') {
        // A diagram that fails prints as drawn (ops I-1175): here, its title in a box.
        const figure = document.createElement('figure');
        figure.textContent = `Diagram: ${group.chunk.title ?? ''}`;
        doc.appendChild(figure);
      }
    }
    if (mode === 'throw') setTimeout(() => { throw new Error('PAGE-ERROR-SECRET-5521'); }, 0);
    // Counts for the tests, not shown: how many chunks of each type arrived.
    const counts = {};
    for (const c of input.chunks) counts[c.type] = (counts[c.type] || 0) + 1;
    root.dataset.received = JSON.stringify(counts);
    console.log('CONSOLE-SECRET-8830', input.title);
    if (mode === 'never') return;
    if (mode === 'hostleak') {
      const img = document.createElement('img');
      const settled = new Promise((resolve) => { img.onload = resolve; img.onerror = resolve; });
      img.src = 'http://host-secret-4471.localhost/a.png';
      doc.appendChild(img);
      await settled;
    }
    await document.fonts.ready;
    signal('ready');
  }

  const api = { version: 1, render };
  if (mode === 'nocontract') return;
  if (mode === 'slowcontract') setTimeout(() => { window.__youlearnPrint = api; }, 60_000);
  else window.__youlearnPrint = api;
})();
</script>
</body>
</html>
